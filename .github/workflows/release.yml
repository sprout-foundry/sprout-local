# Release pipeline: tagged builds -> GitHub Release with per-platform
# tarballs + SHA256SUMS. The install.sh one-liner consumes exactly these
# assets, so asset names are part of the contract:
#   sprout-local-{darwin|linux}-{amd64|arm64}.tar.gz
#   SHA256SUMS
#
# Runners: self-hosted. darwin/arm64 builds natively on the Mac runner
# (sinter's MLX backend needs cgo + Apple's MLX frameworks, only present
# there). linux builds run on the self-hosted Linux X64 runner: amd64
# natively, arm64 via GOARCH cross-compile — the ggml tag path is pure Go
# at build time (nothing imports tensor/ggml, so no libggml needed until
# runtime), so cgo only satisfies runtime/cgo with the native gcc.
#
# Note darwin/amd64 is NOT built: sinter's engine is Apple Silicon only
# (chatmodel_darwin.go is arm64+cgo); an Intel binary would fatal at
# startup. install.sh maps x86_64 Macs to the arm64 build under Rosetta 2,
# which runs fine.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mac runner: native Apple Silicon build (cgo + MLX frameworks).
          - { goos: darwin, goarch: arm64, runner: [self-hosted, macOS, ARM64], cgo: '1' }
          # Linux X64 runner: amd64 native; arm64 via GOARCH cross-compile
          # (pure-Go build under the ggml tag — no C cross-toolchain needed).
          - { goos: linux, goarch: amd64, runner: [self-hosted, Linux, X64], cgo: '1' }
          - { goos: linux, goarch: arm64, runner: [self-hosted, Linux, X64], cgo: '1' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # sinter's MLX cgo bindings need Apple MLX headers/libs under
      # /opt/homebrew. Install when missing so any Mac runner self-heals.
      - name: Ensure Apple MLX (darwin only)
        if: matrix.goos == 'darwin'
        run: |
          # Non-interactive shells don't source .zprofile, so brew isn't on
          # PATH even after install. /opt/homebrew/bin is its only location
          # on Apple Silicon.
          export PATH="/opt/homebrew/bin:$PATH"
          command -v brew >/dev/null || {
            echo "Homebrew not found at /opt/homebrew/bin/brew — install it on this runner."
            exit 1
          }
          # sinter's cgo needs BOTH: mlx (libmlx C++ lib + C++ headers) and
          # mlx-c (the stable C API: mlx/c/*.h, libmlxc).
          brew install mlx mlx-c
          test -f /opt/homebrew/include/mlx/c/array.h
          test -f /opt/homebrew/lib/libmlxc.dylib
          test -f /opt/homebrew/lib/libmlx.dylib

      # linux/arm64 cross-compiles from the X64 runner: runtime/cgo needs an
      # arm64 C compiler even though our own code compiles no C.
      - name: Ensure arm64 cross-compiler (linux/arm64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          command -v aarch64-linux-gnu-gcc >/dev/null || \
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Set CC for linux/arm64 cross
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          GOFLAGS: -buildvcs=false
          GOCACHE: ${{ runner.temp }}/gocache
        run: |
          # linux needs the ggml tag (llm's cgo constraint includes it);
          # darwin (MLX) builds with no extra tags. On the Mac runner, the
          # default SDK (MacOSX27.0) carries tbd files the runner's older
          # Apple linker can't parse — pin SDKROOT to the newest SDK whose
          # major version the installed CLT understands (26.x here).
          TAGS=""
          SDKFIX=""
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            NEWEST="$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX*.sdk 2>/dev/null | sed 's/.*MacOSX//;s/\.sdk//' | grep -E '^[0-9]+(\.[0-9]+)?$' | sort -t. -k1,1n -k2,2n | awk -F. '$1 < 27' | tail -1)"
            if [ -n "$NEWEST" ] && [ -d "/Library/Developer/CommandLineTools/SDKs/MacOSX${NEWEST}.sdk" ]; then
              SDKFIX="SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${NEWEST}.sdk"
              echo "Pinning SDKROOT to MacOSX${NEWEST}.sdk"
            fi
          fi
          env $SDKFIX go build $TAGS -trimpath -ldflags "-s -w" \
            -o "sprout-local-${{ matrix.goos }}-${{ matrix.goarch }}" .

      - name: Smoke test (binary runs on this machine)
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        run: "./sprout-local-${{ matrix.goos }}-${{ matrix.goarch }} -h > /dev/null"

      - name: Package
        run: |
          tar -czf "sprout-local-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            "sprout-local-${{ matrix.goos }}-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sprout-local-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sprout-local-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 sprout-local-*.tar.gz > SHA256SUMS 2>/dev/null \
            || sha256sum sprout-local-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sprout-local-*.tar.gz
            dist/SHA256SUMS
